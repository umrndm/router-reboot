name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.6.4'

      - name: Generate launcher icons
        run: |
          pip install pillow
          python3 tools/gen_icons.py

      - name: Create signing key
        run: |
          keytool -genkeypair -keystore app/release.jks -storepass routerreboot -keypass routerreboot -alias routerreboot -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=Router Reboot, O=Personal, C=PK"

      - name: Build release APK
        run: gradle --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk RouterReboot.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RouterReboot
          path: RouterReboot.apk

      - name: Publish release (stable download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Router Reboot (latest)
          body: Sideload RouterReboot.apk on Android 4.0+. Uninstall the old version first when updating.
          files: RouterReboot.apk
          make_latest: true
